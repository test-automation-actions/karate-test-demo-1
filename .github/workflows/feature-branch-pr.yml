name: "Automate Feature Branch Creation & PR Merge"

on:
  workflow_dispatch:  # Allows manual triggering

permissions:
  contents: write
  pull-requests: write

jobs:
  create-feature-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: develop  # Start from develop branch

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create Feature Branch
        run: |
          FEATURE_BRANCH="feature-auto-${{ github.run_id }}"
          git checkout -b $FEATURE_BRANCH
          echo "FEATURE_BRANCH=$FEATURE_BRANCH" >> $GITHUB_ENV

      - name: Push Empty Commit
        run: |
          git commit --allow-empty -m "Initial empty commit for PR"
          # git push origin $FEATURE_BRANCH
          git push https://x-access-token:${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/test-automation-actions/karate-test-demo-1.git HEAD:refs/heads/${{ env.FEATURE_BRANCH }}

      # - name: Create Pull Request
      #   id: create_pr
      #   uses: peter-evans/create-pull-request@v6
      #   with:
      #     token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      #     base: develop
      #     branch: ${{ env.FEATURE_BRANCH }}
      #     title: "Auto PR - ${{ env.FEATURE_BRANCH }}"
      #     body: "This PR was created automatically."
      #     labels: "automated"

  create-pull-request:
    needs: create-feature-branch
    runs-on: ubuntu-latest
    steps:
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          PR_URL=$(gh pr create --base develop --head ${{ env.FEATURE_BRANCH }} --title "Auto PR for ${{ env.FEATURE_BRANCH }}" --body "This is an automated PR.")
          echo "PR_URL=$PR_URL" >> $GITHUB_ENV

  approve-and-merge-pr:
    needs: create-pull-request
    runs-on: ubuntu-latest
    steps:
      - name: Approve PR
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list --head ${{ env.FEATURE_BRANCH }} --json number --jq '.[0].number')
          gh pr review $PR_NUMBER --approve

      - name: Merge PR
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list --head ${{ env.FEATURE_BRANCH }} --json number --jq '.[0].number')
          gh pr merge $PR_NUMBER --squash --delete-branch
