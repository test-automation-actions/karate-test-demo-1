name: "Automate Feature Branch Creation & PR Merge"

on:
  workflow_dispatch:  # Manually trigger this workflow

permissions:
  contents: write
  pull-requests: write

jobs:
  create-feature-branch:
    runs-on: ubuntu-latest
    outputs:
      feature_branch: ${{ steps.set_branch.outputs.FEATURE_BRANCH }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: develop  

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create Feature Branch
        id: set_branch
        run: |
          FEATURE_BRANCH="feature-auto-${{ github.run_id }}"
          echo "FEATURE_BRANCH=$FEATURE_BRANCH" >> $GITHUB_ENV
          echo "FEATURE_BRANCH=$FEATURE_BRANCH" >> $GITHUB_OUTPUT  # Save as output

      - name: Push Empty Commit
        run: |
          git checkout -b "$FEATURE_BRANCH"
          git commit --allow-empty -m "Initial empty commit for PR"
          git push https://x-access-token:${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/test-automation-actions/karate-test-demo-1.git HEAD:refs/heads/$FEATURE_BRANCH

  create-pull-request:
    needs: create-feature-branch
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.create_pr.outputs.PR_NUMBER }}
    steps:
      - name: Create Pull Request
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          PR_TITLE="Auto PR for ${{ needs.create-feature-branch.outputs.feature_branch }}"
          PR_BODY="This is an automated PR."
          PR_NUMBER=$(gh pr create --base develop --head "${{ needs.create-feature-branch.outputs.feature_branch }}" --title "$PR_TITLE" --body "$PR_BODY" --json number --jq '.number')
          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_OUTPUT  # Save PR number as output

  approve-and-merge-pr:
    needs: create-pull-request
    runs-on: ubuntu-latest
    steps:
      - name: Approve PR
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          gh pr review ${{ needs.create-pull-request.outputs.pr_number }} --approve

      - name: Merge PR
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          gh pr merge ${{ needs.create-pull-request.outputs.pr_number }} --squash --delete-branch
